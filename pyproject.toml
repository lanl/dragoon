[project]
name = "dragoon"
version = "0.1.0"
description = "A collection of benchmark experiments to test agentic AI on HPC architecture"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
dragoon = "dragoon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
